name: Extension packages
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p release && cd clients/browser-extension/chromium && zip -qr ../../../release/vortix-extension-chromium.zip . && cd ../firefox && zip -qr ../../../release/vortix-extension-firefox.zip .
      - uses: actions/upload-artifact@v4
        with: {name: browser-extensions, path: release/*.zip}
