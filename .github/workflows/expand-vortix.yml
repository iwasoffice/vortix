name: Expand Vortix commercial rebuild

on:
  push:
    branches:
      - commercial-rebuild

permissions:
  contents: write

jobs:
  expand:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: commercial-rebuild
          fetch-depth: 0

      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .vortix-deploy/chunk-* > /tmp/vortix-source.b64
          base64 --decode /tmp/vortix-source.b64 > /tmp/vortix-source.tar.xz
          xz --test /tmp/vortix-source.tar.xz
          cp .github/workflows/expand-vortix.yml /tmp/expand-vortix.yml

      - name: Expand production source
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .vortix-deploy -exec rm -rf {} +
          tar -xJf /tmp/vortix-source.tar.xz -C .
          rm -rf .vortix-deploy
          rm -rf .github/workflows
          mkdir -p .github/workflows
          cp /tmp/expand-vortix.yml .github/workflows/expand-vortix.yml

      - name: Build downloadable client source packages
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public/downloads
          mkdir -p public/downloads
          (cd clients/browser-extension/chromium && zip -qr ../../../public/downloads/vortix-extension-chromium.zip .)
          (cd clients/browser-extension/firefox && zip -qr ../../../public/downloads/vortix-extension-firefox.zip .)
          (cd clients/mobile && zip -qr ../../public/downloads/vortix-mobile-source.zip . -x 'node_modules/*' '.expo/*' 'android/*' 'ios/*')
          (cd clients/desktop && zip -qr ../../public/downloads/vortix-desktop-source.zip . -x 'node_modules/*' 'src-tauri/target/*')

      - name: Commit expanded source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "vortix-deploy-bot"
          git config user.email "vortix-deploy-bot@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild Vortix for commercial production"
          git push origin HEAD:commercial-rebuild
