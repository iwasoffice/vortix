[package]
name = "vortix-desktop"
version = "2.0.0"
description = "Vortix payment operations desktop client"
edition = "2021"
[lib]
name = "vortix_desktop_lib"
crate-type = ["staticlib","cdylib","rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
